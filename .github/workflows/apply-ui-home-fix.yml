name: Apply UI home/game-over fix

on:
  push:
    branches:
      - ui-home-gameover-fix

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          if not p.exists():
              raise SystemExit('index.html not found')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="/ui-home-gameover-fix.js"></script>'
          if marker not in s:
              i = s.lower().rfind('</body>')
              if i < 0:
                  raise SystemExit('Could not find </body> in index.html')
              s = s[:i] + marker + '\n' + s[i:]
              p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply home background and game-over visibility"
            git push
          fi
